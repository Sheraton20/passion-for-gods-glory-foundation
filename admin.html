<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f32"><title>Foundation Admin</title><link rel="icon" href="/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#173f32;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dce7e1;border-radius:20px;padding:24px;box-shadow:0 12px 32px rgba(23,63,50,.08)}.login{max-width:460px;margin:8vh auto}.brand{font-size:22px;font-weight:800}.muted{color:#667a71}.field{margin:16px 0}.field label{display:block;font-weight:600;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cbd9d2;border-radius:11px;font-size:16px}.btn{border:0;border-radius:11px;padding:13px 17px;background:#1f6b4f;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6}.error{color:#a43d3d;margin-top:12px;line-height:1.5}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{padding:20px}.stat strong{display:block;font-size:30px;margin-top:8px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tabs button{white-space:nowrap;border:1px solid #ccd9d3;background:#fff;padding:9px 13px;border-radius:999px}.tabs button.active{background:#1f6b4f;color:#fff}.item{padding:18px 0;border-top:1px solid #e5ece8}.item h3{margin:0 0 5px}.meta{font-size:13px;color:#71827a}.details{line-height:1.65;margin-top:10px;overflow-wrap:anywhere}.status{margin-top:12px;padding:9px;border:1px solid #ccd9d3;border-radius:9px;background:#fff}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.stats{grid-template-columns:1fr}.wrap{padding:16px 12px}.card{padding:18px}}</style></head><body><main class="wrap"><section id="loginPanel" class="card login"><div class="brand">A Passion for God’s Glory Foundation</div><p class="muted">Secure private administration</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginButton" class="btn" type="submit">Sign in securely</button><div id="loginError" class="error" role="alert"></div></form></section><section id="app" class="hidden"><div class="top"><div><div class="brand">Foundation Admin</div><div id="who" class="muted"></div></div><button id="logout" class="btn" type="button">Sign out</button></div><div class="stats"><div class="card stat">Volunteers<strong id="volCount">—</strong></div><div class="card stat">Partnerships<strong id="partCount">—</strong></div><div class="card stat">Messages<strong id="msgCount">—</strong></div><div class="card stat">Donations<strong id="donCount">—</strong></div></div><div class="card"><div id="tabs" class="tabs"><button class="active" data-tab="volunteer_applications">Volunteers</button><button data-tab="partnership_inquiries">Partnerships</button><button data-tab="contact_messages">Messages</button><button data-tab="donation_intents">Donations</button><button data-tab="impact_reports">Impact reports</button><button data-tab="programs">Programs</button><button data-tab="projects">Projects</button></div><div id="list"><p class="muted">Loading…</p></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const U="https://azxiopurzajxjksvzvjm.supabase.co",K="sb_publishable_G_WkfZ2z48Zf6ZkVS6o1Fg_htFQWLTZ";let sb,active="volunteer_applications";const $=x=>document.getElementById(x),cfg={volunteer_applications:["full_name","email","country","skills","availability","motivation"],partnership_inquiries:["organization_name","contact_name","email","country","message"],contact_messages:["full_name","email","country","subject","message"],donation_intents:["full_name","email","country","amount","currency","frequency","purpose"],impact_reports:["title","report_year","summary","report_url","published"],programs:["name","slug","description","status"],projects:["name","slug","summary","location","status","start_date","end_date"]},esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function err(x){$("loginError").textContent=x||""}async function loadCounts(){for(const [t,e] of [["volunteer_applications","volCount"],["partnership_inquiries","partCount"],["contact_messages","msgCount"],["donation_intents","donCount"]]){const r=await sb.from(t).select("id",{count:"exact",head:true});$(e).textContent=r.error?"—":(r.count||0)}}async function load(){const f=cfg[active];$("list").innerHTML="<p class='muted'>Loading…</p>";const r=await sb.from(active).select("*").order("created_at",{ascending:false}).limit(50);if(r.error){$("list").innerHTML="<p class='error'>Could not load records. Check admin permissions.</p>";return}if(!r.data.length){$("list").innerHTML="<p class='muted'>No records yet.</p>";return}$("list").innerHTML=r.data.map(x=>"<article class='item'><h3>"+esc(x[f[0]]||"Record")+"</h3><div class='meta'>"+esc(x.created_at||"")+"</div><div class='details'>"+f.map(k=>"<div><b>"+esc(k.replace(/_/g," "))+":</b> "+esc(x[k])+"</div>").join("")+"</div>"+(x.status!==undefined?"<select class='status' data-id='"+esc(x.id)+"'><option value='new'>new</option><option value='reviewing'>reviewing</option><option value='approved'>approved</option><option value='completed'>completed</option><option value='rejected'>rejected</option></select>":"")+"</article>").join("");r.data.forEach(x=>{const s=document.querySelector(".status[data-id='"+CSS.escape(String(x.id))+"']");if(s)s.value=x.status||"new"});document.querySelectorAll(".status").forEach(s=>s.onchange=async()=>{const q=await sb.from(active).update({status:s.value,updated_at:new Date().toISOString()}).eq("id",s.dataset.id);if(q.error)alert("Status update failed.")})}async function check(){const q=await sb.auth.getSession(),u=q.data&&q.data.session&&q.data.session.user;if(!u)return;const a=await sb.from("admin_users").select("user_id").eq("user_id",u.id).maybeSingle();if(a.error||!a.data){await sb.auth.signOut();err("This account is not authorized for administration.");return}$("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=u.email||"";await loadCounts();await load()}async function start(){if(!window.supabase){err("Secure login service did not load. Please refresh the page.");return}sb=window.supabase.createClient(U,K);$("loginForm").onsubmit=async e=>{e.preventDefault();err("");$("loginButton").disabled=true;$("loginButton").textContent="Signing in…";const q=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(q.error)err(q.error.message);else await check();$("loginButton").disabled=false;$("loginButton").textContent="Sign in securely"};$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("tabs").onclick=e=>{if(e.target.tagName!=="BUTTON")return;document.querySelectorAll("#tabs button").forEach(b=>b.classList.remove("active"));e.target.classList.add("active");active=e.target.dataset.tab;load()};await check()}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start()})();</script></body></html>
