<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundation Admin</title><link rel="icon" href="favicon.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7f4;color:#19352b}.wrap{max-width:1200px;margin:auto;padding:28px 20px}.brand{font-weight:800;font-size:22px}.muted{color:#6b7d75}.panel{background:#fff;border:1px solid #dfe8e3;border-radius:20px;padding:24px;box-shadow:0 12px 35px #17382a0d}.login{max-width:460px;margin:10vh auto}.field{display:grid;gap:7px;margin:14px 0}.field input{padding:12px;border:1px solid #ccd9d3;border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#1f6b4f;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#eef4f0;color:#24533f}.error{color:#a33b3b;margin-top:12px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat strong{display:block;font-size:30px;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid #ccd9d3;background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.tabs button.active{background:#1f6b4f;color:#fff}.item{padding:17px 0;border-top:1px solid #e6ece9}.item:first-child{border-top:0}.item h3{margin:0 0 5px}.meta{font-size:13px;color:#71817a}.msg{line-height:1.6;margin-top:10px}.status{margin-top:12px;padding:8px;border:1px solid #ccd9d3;border-radius:8px}.hidden{display:none}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><section id="login" class="panel login"><div class="brand">A Passion for God’s Glory Foundation</div><p class="muted">Private administration area</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">Sign in securely</button></form><div id="loginError" class="error"></div></section><section id="app" class="hidden"><div class="top"><div><div class="brand">Foundation Admin</div><div id="who" class="muted"></div></div><button id="logout" class="btn alt">Sign out</button></div><div class="stats"><div class="panel"><span>Volunteers</span><strong id="volCount">—</strong></div><div class="panel"><span>Partnerships</span><strong id="partCount">—</strong></div><div class="panel"><span>Messages</span><strong id="msgCount">—</strong></div><div class="panel"><span>Donations</span><strong id="donCount">—</strong></div></div><div class="panel"><div class="tabs" id="tabs"><button class="active" data-tab="volunteer_applications">Volunteers</button><button data-tab="partnership_inquiries">Partnerships</button><button data-tab="contact_messages">Messages</button><button data-tab="donation_intents">Donations</button><button data-tab="impact_reports">Impact reports</button><button data-tab="programs">Programs</button><button data-tab="projects">Projects</button></div><div id="list"><p class="muted">Loading…</p></div></div></section></main><script>const URL="https://azxiopurzajxjksvzvjm.supabase.co",KEY="sb_publishable_G_WkfZ2z48Zf6ZkVS6o1Fg_htFQWLTZ";const sb=window.supabase.createClient(URL,KEY);let active="volunteer_applications";const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const config={volunteer_applications:["full_name","email","country","skills","availability","motivation"],partnership_inquiries:["organization_name","contact_name","email","country","message"],contact_messages:["full_name","email","country","subject","message"],donation_intents:["full_name","email","country","amount","currency","frequency","purpose"],impact_reports:["title","report_year","summary","report_url","published"],programs:["name","slug","description","status"],projects:["name","slug","summary","location","status","start_date","end_date"]};async function check(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data}=await sb.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();if(!data){await sb.auth.signOut();loginError.textContent="This account is not authorized for administration.";return}login.classList.add("hidden");app.classList.remove("hidden");who.textContent=user.email||"";loadCounts();load()}async function loginNow(e){e.preventDefault();loginError.textContent="";const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)loginError.textContent=error.message;else check()}async function loadCounts(){for(const [id,el] of [["volunteer_applications","volCount"],["partnership_inquiries","partCount"],["contact_messages","msgCount"],["donation_intents","donCount"]]){const {count}=await sb.from(id).select("id",{count:"exact",head:true});document.getElementById(el).textContent=count??0}}async function load(){const fields=config[active];list.innerHTML="<p class='muted'>Loading…</p>";const {data,error}=await sb.from(active).select("*").order("created_at",{ascending:false}).limit(50);if(error){list.innerHTML="<p class='error'>Could not load records.</p>";return}if(!data.length){list.innerHTML="<p class='muted'>No records yet.</p>";return}list.innerHTML=data.map(r=>"<article class='item'><h3>"+esc(r[fields[0]])+"</h3><div class='meta'>"+esc(r.created_at||"")+"</div><div class='msg'>"+fields.map(k=>"<div><b>"+esc(k.replaceAll("_"," "))+"</b>: "+esc(r[k])+"</div>").join("")+"</div>"+(r.status!==undefined?"<select data-id='"+r.id+"' class='status'><option>new</option><option>reviewing</option><option>approved</option><option>completed</option><option>rejected</option></select>":"")+"</article>").join("");data.forEach(r=>{const s=list.querySelector("[data-id='"+r.id+"']");if(s)s.value=r.status||"new"});list.querySelectorAll(".status").forEach(s=>s.addEventListener("change",async()=>{const {error}=await sb.from(active).update({status:s.value,updated_at:new Date().toISOString()}).eq("id",s.dataset.id);if(error)alert("Status update failed.");else loadCounts()}))}loginForm.addEventListener("submit",loginNow);logout.addEventListener("click",()=>sb.auth.signOut().then(()=>location.reload()));tabs.addEventListener("click",e=>{if(e.target.matches("button")){tabs.querySelectorAll("button").forEach(x=>x.classList.remove("active"));e.target.classList.add("active");active=e.target.dataset.tab;load()}});check();</script></body></html>
