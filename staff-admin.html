<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Approvals | Foundation Admin</title>
<link rel="stylesheet" href="/premium.css?v=20261002-3">
<style>
body{margin:0;background:#f6f8f5;color:#18312b;font-family:Inter,system-ui,sans-serif}.admin{max-width:1100px;margin:auto;padding:35px 18px 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.brand{font-weight:900;color:#0b3d32}.muted{color:#66756f;font-size:13px;line-height:1.6}.panel{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:24px;box-shadow:0 15px 45px rgba(16,44,36,.07)}.login{max-width:480px;margin:10vh auto}.login h1,.panel h2{font-family:"Playfair Display",Georgia,serif;color:#0b3d32}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:800}.field input{padding:13px;border:1px solid #dfe6e1;border-radius:10px;font:inherit}.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:900;cursor:pointer;background:#d8a83e;color:#17382f}.btn.secondary{background:#0b3d32;color:#fff}.btn.decline{background:#f3e3df;color:#8b3e31}.btn:disabled{opacity:.5}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.apps{display:grid;gap:16px}.app{display:grid;grid-template-columns:110px 1fr auto;gap:20px;align-items:center;border:1px solid #e3e9e5;border-radius:18px;padding:18px}.app img{width:100px;height:100px;object-fit:cover;border-radius:16px}.role{font-size:10px;letter-spacing:1.6px;font-weight:900;color:#a97c23}.app h3{margin:6px 0;font:700 24px "Playfair Display",Georgia,serif;color:#0b3d32}.app p{margin:4px 0;font-size:13px;color:#66756f;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:13px;margin-top:12px}.ok{color:#17604d}.err{color:#9a3f32}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.app{grid-template-columns:75px 1fr}.app img{width:75px;height:75px}.actions{grid-column:1/-1}.login{margin:6vh auto}}
</style>
</head>
<body><main class="admin">
<section id="loginView" class="panel login"><div class="role">FOUNDATION ADMIN</div><h1>Staff approvals</h1><p class="muted">Sign in with an authorised foundation administrator account to review employee applications.</p>
<form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Sign in</button><div id="loginStatus" class="status"></div></form></section>
<section id="adminView" hidden><div class="top"><div><div class="role">FOUNDATION ADMIN</div><h1>Employee applications</h1><p class="muted">Approve a person to publish their name, picture and position automatically on the public team page.</p></div><button id="logout" class="btn secondary">Sign out</button></div><div class="panel"><div class="toolbar"><h2>Pending applications</h2><button id="refresh" class="btn">Refresh</button></div><div id="apps" class="apps"></div><div id="adminStatus" class="status"></div></div></section>
</main>
<script>
(()=>{const U="https://azxiopurzajxjksvzvjm.supabase.co",K="sb_publishable_G_WkfZ2z48Zf6ZkVS6o1Fg_htFQWLTZ";let token=null,user=null;
const $=id=>document.getElementById(id),msg=(el,t,c)=>{el.textContent=t;el.className="status "+(c||"")};
async function api(path,opts={}){const h={apikey:K,Accept:"application/json",...(opts.headers||{})};if(token)h.Authorization="Bearer "+token;const r=await fetch(U+path,{...opts,headers:h});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.message||data?.error_description||"Request failed ("+r.status+")");return data}
async function login(e){e.preventDefault();msg($("loginStatus"),"Signing in…");try{const r=await api("/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});token=r.access_token;user=r.user;
const admins=await api("/rest/v1/admin_users?select=user_id&user_id=eq."+encodeURIComponent(user.id));if(!admins.length)throw new Error("This account is not authorised to manage staff.");sessionStorage.setItem("foundation_admin_token",token);sessionStorage.setItem("foundation_admin_user",JSON.stringify(user));$("loginView").hidden=true;$("adminView").hidden=false;await loadApps()}catch(err){token=null;user=null;msg($("loginStatus"),err.message,"err")}}
async function loadApps(){msg($("adminStatus"),"Loading applications…");try{const rows=await api("/rest/v1/employee_applications?select=*&status=eq.pending&order=created_at.desc");const box=$("apps");box.innerHTML="";if(!rows.length){box.innerHTML='<p class="muted">No pending applications right now.</p>';msg($("adminStatus"),"All caught up.","ok");return}rows.forEach(r=>{const el=document.createElement("article");el.className="app";el.innerHTML='<img src="'+r.photo_url+'" alt=""><div><div class="role">'+(r.department||"TEAM MEMBER")+'</div><h3>'+esc(r.full_name)+'</h3><p><strong>'+esc(r.position)+'</strong> · '+esc(r.email)+(r.phone?" · "+esc(r.phone):"")+'</p><p>'+esc(r.bio)+'</p></div><div class="actions"><button class="btn" data-action="approve" data-id="'+r.id+'">Approve & Publish</button><button class="btn decline" data-action="decline" data-id="'+r.id+'">Decline</button></div>';box.appendChild(el)});msg($("adminStatus"),rows.length+" application"+(rows.length===1?"":"s")+" waiting for review.","ok")}catch(err){msg($("adminStatus"),err.message,"err")}}
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("loginForm").addEventListener("submit",login);$("refresh").addEventListener("click",loadApps);
$("logout").addEventListener("click",()=>{token=null;user=null;sessionStorage.removeItem("foundation_admin_token");sessionStorage.removeItem("foundation_admin_user");$("adminView").hidden=true;$("loginView").hidden=false});
$("apps").addEventListener("click",async e=>{const b=e.target.closest("button[data-id]");if(!b)return;b.disabled=true;try{const id=b.dataset.id;if(b.dataset.action==="approve"){await api("/rest/v1/employee_applications?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({status:"approved",approved_at:new Date().toISOString(),approved_by:user.id,updated_at:new Date().toISOString()})});msg($("adminStatus"),"Approved. The employee is now published on the team page.","ok")}else{await api("/rest/v1/employee_applications?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({status:"declined",updated_at:new Date().toISOString()})});msg($("adminStatus"),"Application declined.","ok")}await loadApps()}catch(err){msg($("adminStatus"),err.message,"err");b.disabled=false}});
const saved=sessionStorage.getItem("foundation_admin_token");const savedUser=sessionStorage.getItem("foundation_admin_user");if(saved&&savedUser){token=saved;user=JSON.parse(savedUser);$("loginView").hidden=true;$("adminView").hidden=false;loadApps()}
})();
</script></body></html>
